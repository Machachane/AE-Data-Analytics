name: Deploy AE+ Data Analytics to GitHub Pages

on:
  push:
  workflow_dispatch:

# Only deploy the repository's actual default branch, without assuming main/master.
# No pull-request trigger: untrusted PRs cannot publish or access deployment tokens.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Configure public build settings
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -z "$VITE_API_ORIGIN" ]; then
            echo "::error::Set the repository variable VITE_API_ORIGIN to your production HTTPS backend origin (without /api)."
            exit 1
          fi
          echo "BASE_PATH=${PAGES_BASE_PATH%/}/" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check shared types
        run: pnpm run typecheck:libs
      - name: Check dashboard and backend types
        run: |
          pnpm --filter @workspace/ae-data-analytics run typecheck
          pnpm --filter @workspace/api-server run typecheck
      - name: Check Pages routing and API configuration
        run: |
          pnpm --filter @workspace/ae-data-analytics run test:pages
          pnpm --filter @workspace/api-server run test:cors
      - name: Build static dashboard
        run: pnpm --filter @workspace/ae-data-analytics run build:pages
      - name: Verify deployable routes and assets
        run: pnpm --filter @workspace/ae-data-analytics run verify:pages
      - name: Upload only built frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/ae-data-analytics/dist/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish frontend
        id: deployment
        uses: actions/deploy-pages@v4
