openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /deliveries:
    get:
      operationId: getDeliveries
      tags: [deliveries]
      summary: Delivery records from the OD_DELIVERIES worksheet
      responses:
        "200":
          description: Complete imported delivery dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataset"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    DeliveryRecord:
      type: object
      required: [id, customer, country, region, model, engine, date, quantity, manufacturer]
      properties:
        id: { type: integer }
        customer: { type: string }
        country: { type: string }
        region: { type: string }
        model: { type: string }
        engine: { type: string }
        date: { type: string }
        quantity: { type: number }
        manufacturer: { type: string }
    DeliveryDataset:
      type: object
      required: [source, sheet, minDate, maxDate, rows]
      properties:
        source: { type: string }
        sheet: { type: string }
        minDate: { type: string }
        maxDate: { type: string }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryRecord"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

