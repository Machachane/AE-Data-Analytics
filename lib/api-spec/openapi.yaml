openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /reports/dashboard:
    post:
      operationId: generateDashboardReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardReportInput" }
      responses:
        "200":
          description: AI summary PDF grounded in the current module and selected filters
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400": { description: Invalid module or selections }
        "401": { description: Team sign-in required }
        "429": { description: Report generation is busy or rate limited }
        "503": { description: AI report or source data temporarily unavailable }
  /auth/session:
    get:
      operationId: getTeamSession
      responses:
        "200":
          description: Current team sign-in status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSession" }
        "503": { description: Authentication temporarily unavailable }
  /auth/login:
    post:
      operationId: loginTeam
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamCredentials" }
      responses:
        "200":
          description: Signed in with an HTTP-only session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSession" }
        "400": { description: Invalid input }
        "401": { description: Incorrect credentials }
        "403": { description: Invalid request origin }
        "429": { description: Too many sign-in attempts }
        "503": { description: Authentication temporarily unavailable }
  /auth/logout:
    post:
      operationId: logoutTeam
      responses:
        "204": { description: Session revoked }
        "403": { description: Invalid request origin }
        "503": { description: Sign-out temporarily unavailable }
  /feedback:
    post:
      operationId: submitFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackReceipt" }
        "400": { description: Invalid module or message }
        "429": { description: Too many submissions }
        "503": { description: Feedback storage unavailable }
  /assistant/chat:
    post:
      operationId: askAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantInput" }
      responses:
        "200":
          description: Data-grounded answer with server-generated evidence and navigation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantAnswer" }
        "400": { description: Invalid message }
        "429": { description: Too many requests }
        "503": { description: Assistant or data source unavailable }
  /summary/options:
    get:
      operationId: getSummaryOptions
      responses:
        "200":
          description: Summary source filter choices and reference defaults
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryOptions" }
  /summary:
    get:
      operationId: getSummary
      parameters: &summaryFilters
        - { name: from, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: to, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: country, in: query, schema: { type: string, maxLength: 200 } }
        - { name: airline, in: query, schema: { type: string, maxLength: 200 } }
        - { name: model, in: query, schema: { type: string, maxLength: 100 } }
        - { name: manufacturer, in: query, schema: { type: string, maxLength: 100 } }
        - { name: aircraftModel, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Cross-source summary with explicit measure and filter scopes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryDashboard" }
        "400": { description: Invalid date range or filters }
  /summary/records:
    get:
      operationId: getSummaryRecords
      parameters: &summaryRecordFilters
        - { name: from, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: to, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: country, in: query, schema: { type: string, maxLength: 200 } }
        - { name: airline, in: query, schema: { type: string, maxLength: 200 } }
        - { name: model, in: query, schema: { type: string, maxLength: 100 } }
        - { name: manufacturer, in: query, schema: { type: string, maxLength: 100 } }
        - { name: aircraftModel, in: query, schema: { type: string, maxLength: 100 } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [msn, registration, model, hoursLtm, cyclesLtm, operator, owner, country, manufacturer, engineManufacturer, engineFamily, engineModel, lastUpdate] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Continuous scrolling summary registry window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryRecords" }
        "400": { description: Invalid query }
  /summary/export:
    get:
      operationId: exportSummary
      parameters: *summaryRecordFilters
      responses:
        "200":
          description: All matching summary registry records, independent of window
          content:
            text/csv:
              schema: { type: string }
        "400": { description: Invalid query }
  /airline-financials/options:
    get:
      operationId: getAirlineFinancialOptions
      responses:
        "200":
          description: Financial source metadata, category hierarchy and actual statement choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirlineFinancialOptions" }
  /airline-financials:
    get:
      operationId: getAirlineFinancials
      parameters: &airlineFinancialFilters
        - { name: airline, in: query, schema: { type: string, maxLength: 200 } }
        - { name: financialYear, in: query, schema: { type: string, maxLength: 40 } }
        - { name: period, in: query, schema: { type: string, maxLength: 20 } }
        - { name: metricIds, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Filtered financial metadata and explicitly selected metric sums
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirlineFinancialDashboard" }
        "400": { description: Invalid financial filters }
  /airline-financials/records:
    get:
      operationId: getAirlineFinancialRecords
      parameters: &airlineFinancialRecordFilters
        - { name: airline, in: query, schema: { type: string, maxLength: 200 } }
        - { name: financialYear, in: query, schema: { type: string, maxLength: 40 } }
        - { name: period, in: query, schema: { type: string, maxLength: 20 } }
        - { name: metricIds, in: query, schema: { type: string, maxLength: 512 } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [metric, airline, financialYear, period, fiscalYearEnd, amount, scope, ifrs, inAdministration, category, currency, status] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Scrollable window of matching source financial rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirlineFinancialRecords" }
        "400": { description: Invalid record query }
  /airline-financials/export:
    get:
      operationId: exportAirlineFinancials
      parameters: *airlineFinancialRecordFilters
      responses:
        "200":
          description: All matching source records as CSV, without pagination
          content:
            text/csv:
              schema: { type: string }
        "400": { description: Invalid export query }
  /airline-financials/statements/{id}:
    get:
      operationId: getAirlineFinancialStatement
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Single source statement with balance sheet and profit/loss lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AirlineFinancialStatement" }
        "404": { description: Statement not found }
        "400": { description: Invalid statement id }
  /jurisdiction-risk:
    get:
      operationId: getJurisdictionRisk
      responses:
        "200":
          description: Jurisdiction risk scores and map coordinates from the imported reference data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JurisdictionRiskDataset" }
        "503": { description: Jurisdiction risk source is unavailable }
  /engine-profile:
    get:
      operationId: getEngineProfile
      responses:
        "200":
          description: Complete engine profile reference dataset from the master workbook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EngineProfileDataset" }
        "503": { description: Engine profile source is unavailable }
  /registry/options:
    get:
      operationId: getRegistryOptions
      responses:
        "200":
          description: Registry source metadata and searchable filter choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryOptions" }
  /registry:
    get:
      operationId: getRegistry
      parameters: &registryFilters
        - { name: manufacturer, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: registration, in: query, schema: { type: string } }
        - { name: msn, in: query, schema: { type: string } }
        - { name: operator, in: query, schema: { type: string } }
        - { name: owner, in: query, schema: { type: string } }
        - { name: aircraftType, in: query, schema: { type: string } }
      responses:
        "200":
          description: Filtered source KPI aggregates and registry distributions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryDashboard" }
        "400": { description: Invalid registry filters }
  /registry/records:
    get:
      operationId: getRegistryRecords
      parameters: &registryRecordFilters
        - { name: manufacturer, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: registration, in: query, schema: { type: string } }
        - { name: msn, in: query, schema: { type: string } }
        - { name: operator, in: query, schema: { type: string } }
        - { name: owner, in: query, schema: { type: string } }
        - { name: aircraftType, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [manufacturer, model, aircraftType, registration, msn, operator, operatorIcao, owner, firstFlight, year, engineManufacturer, engineFamily, engineModel, lastUpdate] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Sorted window of registry entries with their latest observed update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistryRecords" }
        "400": { description: Invalid registry table parameters }
  /registry/export:
    get:
      operationId: exportRegistry
      parameters: *registryRecordFilters
      responses:
        "200":
          description: Full filtered registry CSV, ignoring offset and limit
          content:
            text/csv:
              schema: { type: string }
        "400": { description: Invalid registry export filters }
  /emissions/options:
    get:
      operationId: getEmissionsOptions
      responses:
        "200":
          description: Emissions snapshot filter choices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmissionsOptions" }
  /emissions:
    get:
      operationId: getEmissions
      parameters:
        - { name: date, in: query, schema: { type: string } }
        - { name: msn, in: query, schema: { type: string } }
        - { name: icao, in: query, schema: { type: string } }
        - { name: airline, in: query, schema: { type: string } }
        - { name: engine, in: query, schema: { type: string } }
      responses:
        "200":
          description: Filtered headline measures and weighted intensity rankings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmissionsDashboard" }
        "400": { description: Invalid filters }
  /emissions/records:
    get:
      operationId: getEmissionsRecords
      parameters: &emissionsRecordParameters
        - { name: date, in: query, schema: { type: string } }
        - { name: msn, in: query, schema: { type: string } }
        - { name: icao, in: query, schema: { type: string } }
        - { name: airline, in: query, schema: { type: string } }
        - { name: engine, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [msn, icao, airline, operatorGroup, engine, co2, perAsk, perRpk, perRtk, date, hours, cycles] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: Server-sorted window for a continuously scrolling table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmissionsRecords" }
        "400": { description: Invalid filters or table parameters }
  /emissions/export:
    get:
      operationId: exportEmissions
      parameters: *emissionsRecordParameters
      responses:
        "200":
          description: Streamed CSV of all matching records; ignores offset and limit
          content:
            text/csv:
              schema: { type: string }
        "400": { description: Invalid export parameters }
  /market-value-lease-rates:
    get:
      operationId: getMarketRates
      tags: [market-rates]
      summary: Imported market value and lease rate records from the master workbook
      responses:
        "200":
          description: Complete small valuation snapshot, filtered interactively by the client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketRatesDataset"
  /aviation-finance:
    get:
      operationId: getAviationFinance
      tags: [aviation-finance]
      summary: Aviation finance rankings and fixed reference analysis from the three imported workbooks
      parameters:
        - { name: year, in: query, schema: { type: integer } }
        - { name: period, in: query, schema: { type: string } }
      responses:
        "200":
          description: Selected reporting snapshot with available filters and 2025 analysis reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceDashboard"
        "400":
          description: Unsupported year or reporting period
  /utilisation/options:
    get:
      operationId: getUtilisationOptions
      tags: [utilisation]
      summary: Source metadata and available utilisation filters
      responses:
        "200":
          description: Imported fleet snapshot metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilisationOptions"
  /utilisation:
    get:
      operationId: getUtilisation
      tags: [utilisation]
      summary: Filtered aircraft utilisation aggregates
      parameters:
        - { name: from, in: query, schema: { type: string }, description: Inclusive ISO date }
        - { name: to, in: query, schema: { type: string }, description: Inclusive ISO date }
        - { name: airline, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: manufacturer, in: query, schema: { type: string } }
        - { name: msn, in: query, schema: { type: string } }
        - { name: engine, in: query, schema: { type: string } }
      responses:
        "200":
          description: Summary, rankings, monthly trends and FH/FC analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilisationDashboard"
        "400":
          description: Invalid filters
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Order records from the OD_ORDERS worksheet
      responses:
        "200":
          description: Complete imported order dataset with the shared aircraft transaction shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataset"
  /deliveries:
    get:
      operationId: getDeliveries
      tags: [deliveries]
      summary: Delivery records from the OD_DELIVERIES worksheet
      responses:
        "200":
          description: Complete imported delivery dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataset"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    TeamCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 1, maxLength: 200 }
    TeamSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        username: { type: string }
        expiresAt: { type: string, format: date-time }
    FeedbackInput:
      type: object
      required: [module, message]
      properties:
        module:
          type: string
          enum: [Summary, Deliveries, Orders, Aircraft Utilisation, Aviation Finance, Airline Financials, Market Value / Lease Rates, Emissions, Aircraft Registry, Engine Profile, Jurisdiction Risk]
        message: { type: string, minLength: 1, maxLength: 5000 }
    FeedbackReceipt:
      type: object
      required: [id, createdAt]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
    DashboardReportInput:
      type: object
      required: [module, currentFilters]
      properties:
        module:
          type: string
          enum: [summary, deliveries, orders, aircraft-utilisation, aviation-finance, airline-financials, market-value-lease-rates, emissions, aircraft-registry, engine-profile, jurisdiction-risk]
        currentFilters:
          type: string
          minLength: 2
          maxLength: 120000
          description: JSON of the current module's actual interactive selections; arrays represent multi-select values.
    AssistantMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 12000 }
    AssistantInput:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: "#/components/schemas/AssistantMessage" }
        page: { type: string, maxLength: 100 }
        currentFilters:
          type: string
          maxLength: 6000
          description: JSON object of the current module's interactive filter values, including multi-select arrays.
    AssistantAction:
      type: object
      required: [module, filters, label, sourceId]
      properties:
        module: { type: string }
        filters: { type: string }
        label: { type: string }
        sourceId: { type: string }
    AssistantEvidence:
      type: object
      required: [id, module, source, filters, result, href, queriedAt]
      properties:
        id: { type: string }
        module: { type: string }
        source: { type: string }
        filters: { type: string }
        result: { type: string }
        href: { type: string }
        queriedAt: { type: string }
    AssistantAnswer:
      type: object
      required: [answer, evidence, notice]
      properties:
        answer: { type: string }
        notice: { type: string }
        action: { $ref: "#/components/schemas/AssistantAction" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/AssistantEvidence" }
    SummaryCountry:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    SummaryShortcut:
      type: object
      required: [id, label, url]
      properties:
        id: { type: string }
        label: { type: string }
        url: { type: [string, "null"] }
    SummaryOptions:
      type: object
      required: [defaultFrom, defaultTo, countries, airlines, models, manufacturers, aircraftModels, shortcuts, notes]
      properties:
        defaultFrom: { type: string }
        defaultTo: { type: string }
        countries: { type: array, items: { $ref: "#/components/schemas/SummaryCountry" } }
        airlines: { type: array, items: { type: string } }
        models: { type: array, items: { type: string } }
        manufacturers: { type: array, items: { type: string } }
        aircraftModels: { type: array, items: { type: string } }
        shortcuts: { type: array, items: { $ref: "#/components/schemas/SummaryShortcut" } }
        notes: { type: array, items: { type: string } }
    SummaryValue:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: number }
    SummaryVolume:
      type: object
      required: [name, deliveries, orders]
      properties:
        name: { type: string }
        deliveries: { type: number }
        orders: { type: number }
    SummaryIntensity:
      type: object
      required: [name, value, unavailable, rows]
      properties:
        name: { type: string }
        value: { type: number }
        unavailable: { type: boolean }
        rows: { type: integer }
    SummaryFinance:
      type: object
      required: [category, amount, rawAmount, financialYear, ifrs, rows]
      properties:
        category: { type: string }
        amount: { type: [number, "null"] }
        rawAmount: { type: [number, "null"] }
        financialYear: { type: string }
        ifrs: { type: string }
        rows: { type: integer }
    SummaryKpis:
      type: object
      required: [airlines, aircraft, models, hoursLtm, cyclesLtm, avgRatio, sourceRows]
      properties:
        airlines: { type: integer }
        aircraft: { type: integer }
        models: { type: integer }
        hoursLtm: { type: [number, "null"] }
        cyclesLtm: { type: [number, "null"] }
        avgRatio: { type: [number, "null"] }
        sourceRows: { type: integer }
    SummaryDashboard:
      type: object
      required: [from, to, kpis, deliveries, orders, deliveryRegions, orderRegions, manufacturerVolumes, deliveryManufacturerShares, intensities, engines, finance, financeYear, financeRows, emissionsRows, riskRows, riskGeography, registryEntries, rankingLimit]
      properties:
        from: { type: string }
        to: { type: string }
        kpis: { $ref: "#/components/schemas/SummaryKpis" }
        deliveries: { type: number }
        orders: { type: number }
        deliveryRegions: { type: array, items: { $ref: "#/components/schemas/SummaryValue" } }
        orderRegions: { type: array, items: { $ref: "#/components/schemas/SummaryValue" } }
        manufacturerVolumes: { type: array, items: { $ref: "#/components/schemas/SummaryVolume" } }
        deliveryManufacturerShares: { type: array, items: { $ref: "#/components/schemas/SummaryValue" } }
        intensities: { type: array, items: { $ref: "#/components/schemas/SummaryIntensity" } }
        engines: { type: array, items: { $ref: "#/components/schemas/SummaryVolume" } }
        finance: { type: array, items: { $ref: "#/components/schemas/SummaryFinance" } }
        financeYear: { type: string }
        financeRows: { type: integer }
        emissionsRows: { type: integer }
        riskRows: { type: array, items: { $ref: "#/components/schemas/JurisdictionRiskRecord" } }
        riskGeography: { type: string }
        registryEntries: { type: integer }
        rankingLimit: { type: integer }
    SummaryFleetRecord:
      allOf:
        - { $ref: "#/components/schemas/RegistryRecord" }
        - type: object
          required: [country]
          properties:
            country: { type: string }
    SummaryRecords:
      type: object
      required: [rows, total, nextOffset]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/SummaryFleetRecord" } }
        total: { type: integer }
        nextOffset: { type: [integer, "null"] }
    AirlineFinancialMetric:
      type: object
      required: [id, name, category]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
    AirlineStatementChoice:
      type: object
      required: [id, airline, financialYear, period, scope, fiscalYearEnd, currency, rows]
      properties:
        id: { type: integer }
        airline: { type: string }
        financialYear: { type: string }
        period: { type: string }
        scope: { type: string }
        fiscalYearEnd: { type: string }
        currency: { type: string }
        rows: { type: integer }
    AirlineFinancialOptions:
      type: object
